<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e0e5ed" stroke-width=".7"/>
    </pattern>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142642"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83b5ff"/>
      <stop offset="1" stop-color="#28518b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#142642" flood-opacity=".18"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px}
      .small{font-size:9px;font-weight:700;letter-spacing:1px}
      .flow{stroke-dasharray:5 7;animation:flow 3s linear infinite}
      .float{animation:float 3s ease-in-out infinite}
      .float2{animation:float 3.7s ease-in-out infinite reverse}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .blink{animation:blink 1.8s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-48}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect x="1" y="1" width="1198" height="498" rx="29" fill="#fff" stroke="#202020" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="496" rx="28" fill="url(#grid)"/>

  <!-- LEFT TITLE -->
  <rect x="45" y="39" width="111" height="5" rx="2.5" fill="#1d3f73"/>
  <text class="font eyebrow" x="47" y="77" fill="#28518b">ENSEMBLE LEARNING</text>

  <text class="font" x="45" y="123" font-size="35" font-weight="800" fill="#17191d">Part D:</text>
  <text class="font" x="45" y="162" font-size="33" font-weight="800" fill="#17191d">Boosting</text>
  <text class="font" x="45" y="197" font-size="33" font-weight="800" fill="#17191d">Algorithms</text>

  <text class="font" x="46" y="230" font-size="14" fill="#4c5564">Learn sequentially from previous model errors.</text>
  <text class="font" x="46" y="251" font-size="14" fill="#4c5564">Combine weak learners into a stronger model.</text>

  <!-- BOOSTING CONCEPT CARD -->
  <g filter="url(#shadow)">
    <rect x="45" y="275" width="490" height="92" rx="17" fill="#fff" stroke="#25364c" stroke-width="1.4"/>
    <rect x="45" y="275" width="6" height="92" rx="3" fill="#28518b"/>
  </g>
  <text class="font small" x="70" y="299" fill="#7b8492">SEQUENTIAL LEARNING</text>
  <text class="font" x="70" y="329" font-size="20" font-weight="750" fill="#172235">Learn → Correct → Improve</text>
  <text class="font" x="70" y="350" font-size="13" fill="#667080">Each stage helps refine the ensemble prediction.</text>

  <!-- LEFT PROGRESS TRACK -->
  <g class="font small" fill="#7b8492">
    <text x="46" y="399">BASE MODEL</text>
    <text x="180" y="399">ERROR</text>
    <text x="302" y="399">REFINE</text>
    <text x="440" y="399">RESULT</text>
  </g>
  <path d="M55 429H477" stroke="#9aafd0" stroke-width="2" stroke-linecap="round"/>
  <path class="flow" d="M55 429H477" stroke="#28518b" stroke-width="2.2" fill="none"/>
  <circle cx="55" cy="429" r="8" fill="#fff" stroke="#28518b" stroke-width="2.4"/>
  <circle cx="185" cy="429" r="8" fill="#28518b"/>
  <circle cx="321" cy="429" r="8" fill="#28518b"/>
  <circle cx="477" cy="429" r="8" fill="#fff" stroke="#28518b" stroke-width="2.4"/>
  <circle class="pulse" cx="119" cy="429" r="4" fill="#83b5ff"/>
  <circle class="pulse" cx="253" cy="429" r="4" fill="#83b5ff"/>
  <circle class="pulse" cx="399" cy="429" r="4" fill="#83b5ff"/>

  <!-- RIGHT DARK PANEL -->
  <rect x="583" y="38" width="574" height="424" rx="28" fill="url(#navy)" stroke="#28518b" stroke-width="1.8"/>
  <text class="font eyebrow" x="615" y="75" fill="#a8c7f5">BOOSTING ENGINE / 04</text>
  <text class="font" x="615" y="106" font-size="24" font-weight="800" fill="#fff">Errors Drive Improvement</text>
  <text class="font" x="615" y="128" font-size="12" fill="#b7c0cf">Sequential learners · Error correction · Final model</text>

  <!-- STAGE 1 -->
  <g class="float">
    <rect x="615" y="158" width="137" height="104" rx="12" fill="#101c2e" stroke="#426da9" stroke-width="1.3"/>
    <rect x="615" y="158" width="137" height="27" rx="10" fill="#1b3558"/>
    <text class="font small" x="628" y="176" fill="#dceaff">STAGE 01</text>
    <path d="M650 198L634 219H666Z" fill="url(#blue)" stroke="#b7d2ff"/>
    <path d="M634 219L627 233M666 219L673 233" fill="none" stroke="#a9c7f5" stroke-width="1.5"/>
    <rect x="621" y="233" width="12" height="8" rx="2" fill="#28518b" stroke="#83b5ff"/>
    <rect x="667" y="233" width="12" height="8" rx="2" fill="#28518b" stroke="#83b5ff"/>
    <text class="font" x="685" y="213" font-size="10" font-weight="700" fill="#fff">BASE</text>
    <text class="font" x="685" y="227" font-size="10" font-weight="700" fill="#fff">MODEL</text>
    <text class="font" x="628" y="252" font-size="9" fill="#a9c7f5">Initial prediction</text>
  </g>

  <!-- STAGE 1 TO ERROR -->
  <path class="flow" d="M752 208H773" fill="none" stroke="#83b5ff" stroke-width="2"/>
  <path d="M769 203L776 208L769 213" fill="none" stroke="#83b5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ERROR / RESIDUAL -->
  <rect x="777" y="158" width="106" height="104" rx="12" fill="#101c2e" stroke="#426da9" stroke-width="1.3"/>
  <text class="font small" x="790" y="178" fill="#a9c7f5">ERROR</text>
  <g transform="translate(830 208)">
    <path d="M-22 0H22" stroke="#617fa8" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 -22V22" stroke="#617fa8" stroke-width="2" stroke-linecap="round"/>
    <path d="M-15 -13L15 13M15 -13L-15 13" stroke="#83b5ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#fff" filter="url(#glow)"/>
  </g>
  <text class="font" x="830" y="246" text-anchor="middle" font-size="9" fill="#dceaff">Find mistakes</text>

  <!-- ERROR TO NEXT LEARNER -->
  <path class="flow" d="M883 208H905" fill="none" stroke="#83b5ff" stroke-width="2"/>
  <path d="M901 203L908 208L901 213" fill="none" stroke="#83b5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STAGE 2 -->
  <g class="float2">
    <rect x="909" y="158" width="99" height="104" rx="12" fill="#101c2e" stroke="#426da9" stroke-width="1.3"/>
    <text class="font small" x="922" y="178" fill="#a9c7f5">STAGE 02</text>
    <path d="M958 190L942 211H974Z" fill="url(#blue)" stroke="#b7d2ff"/>
    <path d="M942 211L935 224M974 211L981 224" fill="none" stroke="#a9c7f5" stroke-width="1.5"/>
    <rect x="929" y="224" width="12" height="8" rx="2" fill="#28518b" stroke="#83b5ff"/>
    <rect x="975" y="224" width="12" height="8" rx="2" fill="#28518b" stroke="#83b5ff"/>
    <text class="font" x="958" y="247" text-anchor="middle" font-size="9" fill="#dceaff">Correct errors</text>
  </g>

  <!-- STAGE 2 TO FINAL -->
  <path class="flow" d="M1008 208H1030" fill="none" stroke="#83b5ff" stroke-width="2"/>
  <path d="M1026 203L1033 208L1026 213" fill="none" stroke="#83b5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FINAL BOOSTED MODEL -->
  <rect x="1034" y="158" width="96" height="104" rx="12" fill="#172b47" stroke="#83b5ff" stroke-width="1.4"/>
  <g class="float">
    <path d="M1082 181L1065 202H1099Z" fill="url(#blue)" stroke="#d2e4ff"/>
    <path d="M1065 202L1058 215M1099 202L1106 215" fill="none" stroke="#b7d2ff" stroke-width="1.5"/>
    <rect x="1052" y="215" width="12" height="8" rx="2" fill="#28518b" stroke="#83b5ff"/>
    <rect x="1100" y="215" width="12" height="8" rx="2" fill="#28518b" stroke="#83b5ff"/>
  </g>
  <text class="font" x="1082" y="240" text-anchor="middle" font-size="9" font-weight="700" fill="#dceaff">BOOSTED</text>
  <text class="font" x="1082" y="252" text-anchor="middle" font-size="9" font-weight="700" fill="#dceaff">MODEL</text>

  <!-- ITERATION INDICATOR -->
  <path d="M958 272V289H830V272" fill="none" stroke="#557db5" stroke-width="1.3"/>
  <path class="flow" d="M958 272V289H830V272" fill="none" stroke="#83b5ff" stroke-width="1.5"/>
  <path d="M825 278L830 271L835 278" fill="none" stroke="#83b5ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="font" x="894" y="303" text-anchor="middle" font-size="9" letter-spacing="1" fill="#a9c7f5">ITERATIVE IMPROVEMENT</text>

  <!-- BOTTOM ALGORITHM STRIP -->
  <rect x="615" y="322" width="515" height="58" rx="11" fill="#101c2e" stroke="#355b91" stroke-width="1.2"/>
  <text class="font small" x="631" y="342" fill="#a9c7f5">BOOSTING FAMILY</text>

  <rect x="631" y="351" width="101" height="19" rx="5" fill="#1c3658" stroke="#426da9"/>
  <text class="font" x="681.5" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#e4efff">AdaBoost</text>

  <rect x="741" y="351" width="115" height="19" rx="5" fill="#1c3658" stroke="#426da9"/>
  <text class="font" x="798.5" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#e4efff">Gradient Boosting</text>

  <rect x="865" y="351" width="79" height="19" rx="5" fill="#1c3658" stroke="#426da9"/>
  <text class="font" x="904.5" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#e4efff">XGBoost</text>

  <rect x="953" y="351" width="79" height="19" rx="5" fill="#1c3658" stroke="#426da9"/>
  <text class="font" x="992.5" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#e4efff">LightGBM</text>

  <text class="font" x="615" y="420" font-size="9.5" letter-spacing=".8" fill="#8398b8">SEQUENTIAL LEARNING · ERROR CORRECTION · ENSEMBLE MODEL</text>
  <path class="flow" d="M1015 420H1128" fill="none" stroke="#4779c0" stroke-width="1.5"/>
  <circle class="pulse" cx="1128" cy="420" r="3" fill="#83b5ff" filter="url(#glow)"/>
</svg>
