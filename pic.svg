<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DCE5F0" stroke-width=".8"/>
    </pattern>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101F35"/>
      <stop offset="100%" stop-color="#050D19"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4386D9"/>
      <stop offset="100%" stop-color="#A4D8FF"/>
    </linearGradient>
    <linearGradient id="barLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#315D9D"/>
      <stop offset="100%" stop-color="#77BFFF"/>
    </linearGradient>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .mainTitle { font-size: 35px; font-weight: 800; fill: #17191F; }
      .eyebrow { font-size: 11px; font-weight: 700; fill: #28518A; letter-spacing: 2px; }
      .desc { font-size: 13px; fill: #59677D; }
      .panelTitle { font-size: 23px; font-weight: 800; fill: #FFFFFF; }
      .panelSub { font-size: 11px; fill: #B3C3D9; }
      .label { font-size: 10px; font-weight: 700; fill: #E4F2FF; }
      .small { font-size: 9px; fill: #AFC4DE; }
      .metric { font-size: 17px; font-weight: 800; fill: #FFFFFF; }
      .wire { fill: none; stroke: #83B9FF; stroke-width: 1.5; }
      .moving { stroke-dasharray: 5 5; animation: flow 2s linear infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      .float2 { animation: float 3s ease-in-out 1s infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .barAnim { transform-box: fill-box; transform-origin: left center; animation: barGrow 3s ease-in-out infinite alternate; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes barGrow { from { transform: scaleX(.78); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="29" fill="#FFFFFF"/>
  <rect width="1200" height="500" rx="29" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="498" rx="28" fill="none" stroke="#202124" stroke-width="2"/>

  <!-- LEFT TITLE AREA -->
  <rect x="45" y="39" width="111" height="5" rx="2.5" fill="#23487F"/>
  <text x="47" y="76" class="eyebrow">MACHINE LEARNING</text>

  <text x="45" y="122" class="mainTitle">Part F:</text>
  <text x="45" y="157" class="mainTitle">Model</text>
  <text x="45" y="192" class="mainTitle">Evaluation &amp;</text>
  <text x="45" y="227" class="mainTitle">Comparison</text>

  <text x="46" y="260" class="desc">Measure model performance, compare</text>
  <text x="46" y="278" class="desc">results, and select a suitable model.</text>

  <!-- Concept card -->
  <rect x="45" y="296" width="490" height="92" rx="16" fill="#DCE5EF" opacity=".7"/>
  <rect x="45" y="291" width="490" height="92" rx="16" fill="#FFFFFF" stroke="#263B58" stroke-width="1.4"/>
  <rect x="45" y="291" width="6" height="92" rx="3" fill="#28548E"/>
  <text x="70" y="316" font-size="9" font-weight="700" fill="#718096" letter-spacing="1">MODEL SELECTION PROCESS</text>
  <text x="70" y="343" font-size="21" font-weight="800" fill="#1B2638">Test → Measure → Compare</text>
  <text x="70" y="365" font-size="12" fill="#5B6A80">Use the right metrics for the prediction task.</text>

  <!-- Bottom progress line -->
  <text x="46" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">PREDICT</text>
  <text x="166" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">EVALUATE</text>
  <text x="303" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">COMPARE</text>
  <text x="438" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">SELECT</text>
  <path d="M55 429H477" stroke="#244A80" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="55" cy="429" r="8" fill="#FFFFFF" stroke="#28548E" stroke-width="2.4"/>
  <circle cx="119" cy="429" r="4" fill="#81B5FF" class="pulse"/>
  <circle cx="185" cy="429" r="8" fill="#28548E"/>
  <circle cx="252" cy="429" r="4" fill="#81B5FF" class="pulse"/>
  <circle cx="321" cy="429" r="8" fill="#28548E"/>
  <circle cx="399" cy="429" r="4" fill="#81B5FF" class="pulse"/>
  <circle cx="477" cy="429" r="8" fill="#FFFFFF" stroke="#28548E" stroke-width="2.4"/>
  <text x="46" y="464" font-size="10" fill="#75849A">Machine Learning • Performance Analysis</text>

  <!-- RIGHT DARK PANEL -->
  <rect x="582" y="37" width="576" height="426" rx="28" fill="#D4DFEB" opacity=".5"/>
  <rect x="582" y="37" width="576" height="426" rx="28" fill="url(#dark)" stroke="#28548E" stroke-width="1.6"/>

  <text x="614" y="76" font-size="10" font-weight="700" fill="#9EC5FF" letter-spacing="1.8">MODEL LAB / 06</text>
  <text x="614" y="106" class="panelTitle">Measure. Compare. Decide.</text>
  <text x="614" y="126" class="panelSub">Evaluation metrics • Model benchmarks • Final selection</text>

  <!-- KPI cards -->
  <g class="float">
    <rect x="614" y="145" width="120" height="66" rx="10" fill="#142B48" stroke="#365F91"/>
    <text x="628" y="164" class="small">ACCURACY</text>
    <text x="628" y="190" class="metric">Score</text>
    <rect x="628" y="199" width="91" height="3" rx="1.5" fill="#27486F"/>
    <rect x="628" y="199" width="66" height="3" rx="1.5" fill="#82BEFF" class="pulse"/>
  </g>
  <g class="float2">
    <rect x="744" y="145" width="120" height="66" rx="10" fill="#142B48" stroke="#365F91"/>
    <text x="758" y="164" class="small">PRECISION</text>
    <text x="758" y="190" class="metric">P / TP</text>
    <rect x="758" y="199" width="91" height="3" rx="1.5" fill="#27486F"/>
    <rect x="758" y="199" width="74" height="3" rx="1.5" fill="#82BEFF" class="pulse"/>
  </g>
  <g class="float">
    <rect x="874" y="145" width="120" height="66" rx="10" fill="#142B48" stroke="#365F91"/>
    <text x="888" y="164" class="small">RECALL</text>
    <text x="888" y="190" class="metric">TP / P</text>
    <rect x="888" y="199" width="91" height="3" rx="1.5" fill="#27486F"/>
    <rect x="888" y="199" width="59" height="3" rx="1.5" fill="#82BEFF" class="pulse"/>
  </g>
  <g class="float2">
    <rect x="1004" y="145" width="120" height="66" rx="10" fill="#142B48" stroke="#365F91"/>
    <text x="1018" y="164" class="small">F1-SCORE</text>
    <text x="1018" y="190" class="metric">Balance</text>
    <rect x="1018" y="199" width="91" height="3" rx="1.5" fill="#27486F"/>
    <rect x="1018" y="199" width="70" height="3" rx="1.5" fill="#82BEFF" class="pulse"/>
  </g>

  <!-- Comparison chart area -->
  <rect x="614" y="225" width="324" height="164" rx="11" fill="#0B182A" stroke="#294B77"/>
  <text x="630" y="245" font-size="10" font-weight="700" fill="#D9E9FF" letter-spacing=".8">MODEL SCORE COMPARISON</text>
  <text x="630" y="260" class="small">Illustrative normalized scores</text>

  <!-- Chart guides -->
  <g stroke="#263E5D" stroke-width="1">
    <path d="M675 278H919 M675 308H919 M675 338H919 M675 368H919"/>
  </g>
  <g class="small" text-anchor="end">
    <text x="666" y="281">100</text>
    <text x="666" y="311">75</text>
    <text x="666" y="341">50</text>
    <text x="666" y="371">25</text>
  </g>

  <!-- Animated horizontal bars -->
  <text x="681" y="292" class="small">Model A</text>
  <rect x="736" y="282" width="178" height="11" rx="3" fill="#1B2F4A"/>
  <rect x="736" y="282" width="139" height="11" rx="3" fill="url(#barBlue)" class="barAnim"/>
  <text x="920" y="292" text-anchor="end" font-size="9" fill="#E4F2FF">A</text>

  <text x="681" y="322" class="small">Model B</text>
  <rect x="736" y="312" width="178" height="11" rx="3" fill="#1B2F4A"/>
  <rect x="736" y="312" width="157" height="11" rx="3" fill="url(#barLight)" class="barAnim"/>
  <text x="920" y="322" text-anchor="end" font-size="9" fill="#E4F2FF">B</text>

  <text x="681" y="352" class="small">Model C</text>
  <rect x="736" y="342" width="178" height="11" rx="3" fill="#1B2F4A"/>
  <rect x="736" y="342" width="119" height="11" rx="3" fill="url(#barBlue)" class="barAnim"/>
  <text x="920" y="352" text-anchor="end" font-size="9" fill="#E4F2FF">C</text>

  <text x="681" y="379" font-size="8.5" fill="#819DBD">Compare metrics on the same scale</text>

  <!-- Right selection card -->
  <rect x="950" y="225" width="174" height="164" rx="11" fill="#0B182A" stroke="#294B77"/>
  <text x="965" y="245" font-size="10" font-weight="700" fill="#D9E9FF">SELECTION CHECKLIST</text>

  <g class="pulse">
    <circle cx="970" cy="270" r="6" fill="#254D7B" stroke="#82BEFF"/>
    <path d="M967 270L969 272L973 267" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
  </g>
  <text x="984" y="273" class="small">Generalization</text>

  <circle cx="970" cy="296" r="6" fill="#254D7B" stroke="#82BEFF"/>
  <path d="M967 296L969 298L973 293" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
  <text x="984" y="299" class="small">Error metrics</text>

  <circle cx="970" cy="322" r="6" fill="#254D7B" stroke="#82BEFF"/>
  <path d="M967 322L969 324L973 319" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
  <text x="984" y="325" class="small">Validation results</text>

  <circle cx="970" cy="348" r="6" fill="#254D7B" stroke="#82BEFF"/>
  <path d="M967 348L969 350L973 345" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
  <text x="984" y="351" class="small">Business objective</text>

  <rect x="965" y="365" width="144" height="14" rx="4" fill="#1C385C"/>
  <text x="1037" y="375" text-anchor="middle" font-size="8" font-weight="700" fill="#CFE9FF">SELECT WITH CONTEXT</text>

  <!-- Metric family strip -->
  <rect x="614" y="402" width="510" height="35" rx="8" fill="#142B48" stroke="#31577F"/>
  <text x="629" y="416" font-size="8.5" font-weight="700" fill="#A9D5FF">CLASSIFICATION</text>
  <text x="629" y="428" class="small">Precision • Recall • F1 • ROC-AUC</text>
  <path d="M861 409V430" stroke="#345779"/>
  <text x="876" y="416" font-size="8.5" font-weight="700" fill="#A9D5FF">REGRESSION</text>
  <text x="876" y="428" class="small">MAE • MSE • RMSE • R²</text>

  <!-- Footer -->
  <text x="614" y="449" font-size="9" fill="#7895B8">EVALUATION • BENCHMARKING • MODEL SELECTION</text>
  <path d="M1015 449H1124" stroke="#426D9C" stroke-width="1.2" stroke-dasharray="4 6"/>
  <circle cx="1125" cy="449" r="3" fill="#8FC6FF" class="pulse"/>
</svg>
