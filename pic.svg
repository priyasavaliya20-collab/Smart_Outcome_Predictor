<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e0e5ed" stroke-width=".7"/>
    </pattern>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142642"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83b5ff"/>
      <stop offset="1" stop-color="#28518b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#142642" flood-opacity=".18"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px}
      .small{font-size:9px;font-weight:700;letter-spacing:1px}
      .flow{stroke-dasharray:5 7;animation:flow 3.5s linear infinite}
      .float{animation:float 3s ease-in-out infinite}
      .float2{animation:float 3.7s ease-in-out infinite reverse}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
      .blink{animation:blink 1.8s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-48}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect x="1" y="1" width="1198" height="498" rx="29" fill="#fff" stroke="#202020" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="496" rx="28" fill="url(#grid)"/>

  <!-- LEFT TITLE -->
  <rect x="45" y="39" width="111" height="5" rx="2.5" fill="#1d3f73"/>
  <text class="font eyebrow" x="47" y="77" fill="#28518b">ENSEMBLE LEARNING</text>

  <text class="font" x="45" y="119" font-size="34" font-weight="800" fill="#17191d">Part C: Bagging</text>
  <text class="font" x="45" y="153" font-size="21" font-weight="750" fill="#17191d">(Bootstrap Aggregating)</text>

  <text class="font" x="46" y="190" font-size="14" fill="#4c5564">Train multiple models on bootstrap samples.</text>
  <text class="font" x="46" y="212" font-size="14" fill="#4c5564">Combine predictions for a more stable result.</text>

  <!-- CONCEPT CARD -->
  <g filter="url(#shadow)">
    <rect x="45" y="239" width="490" height="111" rx="17" fill="#fff" stroke="#25364c" stroke-width="1.4"/>
    <rect x="45" y="239" width="6" height="111" rx="3" fill="#28518b"/>
  </g>
  <text class="font small" x="70" y="264" fill="#7b8492">BAGGING WORKFLOW</text>
  <text class="font" x="70" y="295" font-size="20" font-weight="750" fill="#172235">Sample → Train → Aggregate</text>
  <text class="font" x="70" y="320" font-size="13" fill="#667080">Parallel learners produce one combined prediction.</text>

  <!-- WORKFLOW TRACK -->
  <g class="font small" fill="#7b8492">
    <text x="46" y="382">SAMPLE</text>
    <text x="175" y="382">TRAIN</text>
    <text x="307" y="382">COMBINE</text>
    <text x="446" y="382">PREDICT</text>
  </g>
  <path d="M55 413H477" stroke="#9aafd0" stroke-width="2" stroke-linecap="round"/>
  <path class="flow" d="M55 413H477" stroke="#28518b" stroke-width="2.2" fill="none"/>
  <circle cx="55" cy="413" r="8" fill="#fff" stroke="#28518b" stroke-width="2.4"/>
  <circle cx="185" cy="413" r="8" fill="#28518b"/>
  <circle cx="321" cy="413" r="8" fill="#28518b"/>
  <circle cx="477" cy="413" r="8" fill="#fff" stroke="#28518b" stroke-width="2.4"/>
  <circle class="pulse" cx="119" cy="413" r="4" fill="#83b5ff"/>
  <circle class="pulse" cx="253" cy="413" r="4" fill="#83b5ff"/>
  <circle class="pulse" cx="399" cy="413" r="4" fill="#83b5ff"/>

  <!-- RIGHT PANEL -->
  <rect x="583" y="38" width="574" height="424" rx="28" fill="url(#navy)" stroke="#28518b" stroke-width="1.8"/>

  <text class="font eyebrow" x="615" y="75" fill="#a8c7f5">ENSEMBLE ENGINE / 03</text>
  <text class="font" x="615" y="106" font-size="24" font-weight="800" fill="#fff">Bootstrap Aggregating</text>
  <text class="font" x="615" y="128" font-size="12" fill="#b7c0cf">Independent models · Combined prediction</text>

  <!-- ORIGINAL DATASET -->
  <rect x="614" y="157" width="100" height="103" rx="11" fill="#101c2e" stroke="#426da9" stroke-width="1.3"/>
  <text class="font small" x="626" y="176" fill="#a9c7f5">DATASET</text>
  <g fill="#dceaff">
    <rect x="627" y="189" width="70" height="4" rx="2"/>
    <rect x="627" y="201" width="53" height="4" rx="2"/>
    <rect x="627" y="213" width="64" height="4" rx="2"/>
    <rect x="627" y="225" width="44" height="4" rx="2"/>
    <rect x="627" y="237" width="61" height="4" rx="2"/>
    <rect x="627" y="249" width="48" height="4" rx="2"/>
  </g>

  <!-- BRANCHING DATA FLOW -->
  <path d="M714 208H735V174H751M735 208V226H751M735 208V278H751"
        fill="none" stroke="#557db5" stroke-width="1.5"/>
  <path class="flow" d="M714 208H735V174H751M735 208V226H751M735 208V278H751"
        fill="none" stroke="#83b5ff" stroke-width="1.6"/>
  <path d="M735 208l-4 -5v10z" fill="#83b5ff"/>

  <!-- BOOTSTRAP SAMPLE CARDS -->
  <g>
    <rect x="751" y="153" width="91" height="42" rx="8" fill="#172b47" stroke="#4779c0"/>
    <rect x="751" y="208" width="91" height="42" rx="8" fill="#172b47" stroke="#4779c0"/>
    <rect x="751" y="263" width="91" height="42" rx="8" fill="#172b47" stroke="#4779c0"/>

    <text class="font" x="796.5" y="169" text-anchor="middle" font-size="8" font-weight="700" fill="#a9c7f5">SAMPLE 1</text>
    <text class="font" x="796.5" y="184" text-anchor="middle" font-size="10" fill="#fff">A B A C</text>

    <text class="font" x="796.5" y="224" text-anchor="middle" font-size="8" font-weight="700" fill="#a9c7f5">SAMPLE 2</text>
    <text class="font" x="796.5" y="239" text-anchor="middle" font-size="10" fill="#fff">B D A B</text>

    <text class="font" x="796.5" y="279" text-anchor="middle" font-size="8" font-weight="700" fill="#a9c7f5">SAMPLE 3</text>
    <text class="font" x="796.5" y="294" text-anchor="middle" font-size="10" fill="#fff">C A D C</text>
  </g>

  <!-- CONNECT SAMPLES TO LEARNERS -->
  <path class="flow" d="M842 174H873M842 229H873M842 284H873"
        fill="none" stroke="#83b5ff" stroke-width="1.7"/>
  <circle class="pulse" cx="856" cy="174" r="3" fill="#fff"/>
  <circle class="pulse" cx="856" cy="229" r="3" fill="#fff"/>
  <circle class="pulse" cx="856" cy="284" r="3" fill="#fff"/>

  <!-- DECISION TREE 1 -->
  <g class="float">
    <g transform="translate(889 158)">
      <path d="M0 0L-12 13H12Z" fill="url(#blue)" stroke="#c6dcff"/>
      <path d="M-12 13L-20 26M12 13L20 26" stroke="#a9c7f5" stroke-width="1.5" fill="none"/>
      <rect x="-26" y="25" width="12" height="9" rx="2" fill="#28518b" stroke="#83b5ff"/>
      <rect x="14" y="25" width="12" height="9" rx="2" fill="#28518b" stroke="#83b5ff"/>
    </g>
  </g>

  <!-- DECISION TREE 2 -->
  <g class="float2">
    <g transform="translate(889 213)">
      <path d="M0 0L-12 13H12Z" fill="url(#blue)" stroke="#c6dcff"/>
      <path d="M-12 13L-20 26M12 13L20 26" stroke="#a9c7f5" stroke-width="1.5" fill="none"/>
      <rect x="-26" y="25" width="12" height="9" rx="2" fill="#28518b" stroke="#83b5ff"/>
      <rect x="14" y="25" width="12" height="9" rx="2" fill="#28518b" stroke="#83b5ff"/>
    </g>
  </g>

  <!-- DECISION TREE 3 -->
  <g class="float">
    <g transform="translate(889 268)">
      <path d="M0 0L-12 13H12Z" fill="url(#blue)" stroke="#c6dcff"/>
      <path d="M-12 13L-20 26M12 13L20 26" stroke="#a9c7f5" stroke-width="1.5" fill="none"/>
      <rect x="-26" y="25" width="12" height="9" rx="2" fill="#28518b" stroke="#83b5ff"/>
      <rect x="14" y="25" width="12" height="9" rx="2" fill="#28518b" stroke="#83b5ff"/>
    </g>
  </g>

  <!-- LEARNER OUTPUTS TO AGGREGATION -->
  <path d="M915 184H936V226M915 239H936V226M915 294H936V226H953"
        fill="none" stroke="#557db5" stroke-width="1.5"/>
  <path class="flow" d="M915 184H936V226M915 239H936V226M915 294H936V226H953"
        fill="none" stroke="#83b5ff" stroke-width="1.6"/>
  <circle class="pulse" cx="936" cy="226" r="4" fill="#fff" filter="url(#glow)"/>

  <!-- AGGREGATION BLOCK: RECTANGULAR, NO ORBIT -->
  <rect x="953" y="196" width="54" height="60" rx="9" fill="#172b47" stroke="#83b5ff" stroke-width="1.4"/>
  <g stroke="#e5efff" stroke-width="2.5" stroke-linecap="round">
    <path d="M966 214H994"/>
    <path d="M966 226H994"/>
    <path d="M966 238H994"/>
  </g>
  <path class="flow" d="M1007 226H1022" stroke="#83b5ff" stroke-width="2" fill="none"/>

  <!-- FINAL PREDICTION -->
  <rect x="1022" y="183" width="108" height="86" rx="12" fill="#101c2e" stroke="#4779c0" stroke-width="1.3"/>
  <g class="float">
    <circle cx="1076" cy="207" r="13" fill="#244d83"/>
    <path d="M1069 207L1074 212L1083 202" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="font" x="1076" y="235" text-anchor="middle" font-size="9" font-weight="700" fill="#a9c7f5">FINAL</text>
  <text class="font" x="1076" y="249" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">PREDICTION</text>
  <text class="font" x="1076" y="261" text-anchor="middle" font-size="7.5" fill="#a9c7f5">VOTE / AVERAGE</text>

  <!-- STATUS CARD -->
  <rect x="614" y="329" width="516" height="48" rx="10" fill="#101c2e" stroke="#355b91" stroke-width="1.2"/>
  <circle cx="634" cy="352" r="7" fill="#244d83"/>
  <path d="M630 352L633 355L638 348" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <text class="font small" x="649" y="349" fill="#a9c7f5">ENSEMBLE STATUS</text>
  <text class="font" x="649" y="365" font-size="12" font-weight="800" fill="#fff">MULTIPLE LEARNERS COMBINED</text>

  <!-- FOOTER -->
  <text class="font" x="614" y="419" font-size="9" letter-spacing=".8" fill="#8398b8">BOOTSTRAP SAMPLES · DECISION TREES · AGGREGATION</text>
  <path class="flow" d="M1005 419H1125" fill="none" stroke="#4779c0" stroke-width="1.5"/>
  <circle class="pulse" cx="1125" cy="419" r="3" fill="#83b5ff" filter="url(#glow)"/>
</svg>
