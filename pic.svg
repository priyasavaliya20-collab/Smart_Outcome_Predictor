<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e0e5ed" stroke-width=".7"/>
    </pattern>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142642"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83b5ff"/>
      <stop offset="1" stop-color="#28518b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#142642" flood-opacity=".16"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:2.1px}
      .small{font-size:10px;font-weight:700;letter-spacing:1.2px}
      .float{animation:float 3s ease-in-out infinite}
      .float2{animation:float 3.8s ease-in-out infinite reverse}
      .spin{transform-origin:850px 230px;animation:spin 12s linear infinite}
      .spinback{transform-origin:850px 230px;animation:spinback 17s linear infinite}
      .flow{stroke-dasharray:5 7;animation:flow 4s linear infinite}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
      .shine{animation:shine 2s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinback{to{transform:rotate(-360deg)}}
      @keyframes flow{to{stroke-dashoffset:-48}}
      @keyframes pulse{0%,100%{transform:scale(.8);opacity:.65}50%{transform:scale(1.25);opacity:1}}
      @keyframes shine{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect x="1" y="1" width="1198" height="498" rx="29" fill="#fff" stroke="#202020" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="496" rx="28" fill="url(#grid)"/>

  <!-- LEFT: TITLE -->
  <rect x="45" y="39" width="111" height="5" rx="2.5" fill="#1d3f73"/>
  <text class="font eyebrow" x="47" y="77" fill="#28518b">MACHINE LEARNING PROJECT</text>

  <text class="font" x="45" y="121" font-size="33" font-weight="800" fill="#17191d">Part B:</text>
  <text class="font" x="45" y="160" font-size="29" font-weight="800" fill="#17191d">Dataset Understanding</text>
  <text class="font" x="45" y="195" font-size="29" font-weight="800" fill="#17191d">&amp; Preparation</text>

  <text class="font" x="46" y="225" font-size="14" fill="#626c7b">Explore, clean and prepare the data.</text>
  <text class="font" x="46" y="246" font-size="14" fill="#626c7b">Build a reliable foundation for ML models.</text>

  <!-- DATA PREPARATION CARD -->
  <g filter="url(#shadow)">
    <rect x="45" y="267" width="490" height="100" rx="17" fill="#fff" stroke="#25364c" stroke-width="1.4"/>
    <rect x="45" y="267" width="6" height="100" rx="3" fill="#28518b"/>
  </g>
  <text class="font small" x="70" y="291" fill="#7b8492">DATA PREPARATION PIPELINE</text>
  <text class="font" x="70" y="321" font-size="20" font-weight="750" fill="#172235">Inspect → Clean → Transform</text>
  <text class="font" x="70" y="345" font-size="13" fill="#667080">Quality data. Meaningful features. Ready to learn.</text>

  <!-- LEFT BOTTOM PROGRESS -->
  <text class="font small" x="46" y="398" fill="#7b8492">RAW DATA</text>
  <text class="font small" x="187" y="398" fill="#7b8492">CLEANING</text>
  <text class="font small" x="340" y="398" fill="#7b8492">FEATURES</text>
  <text class="font small" x="457" y="398" fill="#7b8492">READY</text>

  <path d="M55 429H477" stroke="#9aafd0" stroke-width="2" stroke-linecap="round"/>
  <path class="flow" d="M55 429H477" stroke="#28518b" stroke-width="2.2" fill="none"/>
  <circle cx="55" cy="429" r="8" fill="#fff" stroke="#28518b" stroke-width="2.4"/>
  <circle cx="203" cy="429" r="8" fill="#28518b"/>
  <circle cx="355" cy="429" r="8" fill="#28518b"/>
  <circle cx="477" cy="429" r="8" fill="#fff" stroke="#28518b" stroke-width="2.4"/>
  <circle class="pulse" cx="126" cy="429" r="4" fill="#83b5ff"/>
  <circle class="pulse" cx="278" cy="429" r="4" fill="#83b5ff"/>
  <circle class="pulse" cx="415" cy="429" r="4" fill="#83b5ff"/>

  <!-- RIGHT: DARK DATA WORKSPACE -->
  <rect x="583" y="38" width="574" height="424" rx="28" fill="url(#navy)" stroke="#28518b" stroke-width="1.8"/>

  <text class="font eyebrow" x="618" y="76" fill="#a8c7f5">DATA LAB / 02</text>
  <text class="font" x="618" y="107" font-size="25" font-weight="800" fill="#fff">Understand Your Data</text>
  <text class="font" x="618" y="130" font-size="13" fill="#b7c0cf">From raw dataset to model-ready features</text>

  <!-- DECORATIVE DATA GRID -->
  <g opacity=".17" stroke="#80a9ed" stroke-width="1">
    <path d="M610 152H1130M610 172H1130M610 192H1130M610 212H1130"/>
    <path d="M650 145V260M700 145V260M750 145V260M800 145V260M850 145V260M900 145V260M950 145V260M1000 145V260M1050 145V260M1100 145V260"/>
  </g>

  <!-- RAW DATASET TABLE -->
  <g filter="url(#shadow)">
    <rect x="614" y="158" width="158" height="120" rx="12" fill="#101c2e" stroke="#426da9" stroke-width="1.3"/>
    <rect x="614" y="158" width="158" height="27" rx="11" fill="#1b3558"/>
    <path d="M614 175V185H772V175" fill="#1b3558"/>
  </g>
  <text class="font small" x="628" y="176" fill="#dceaff">RAW DATASET</text>

  <g stroke="#405878" stroke-width=".8">
    <path d="M625 203H761M625 222H761M625 241H761M625 260H761"/>
    <path d="M670 188V269M717 188V269"/>
  </g>
  <g fill="#8bb8ff">
    <rect x="627" y="192" width="25" height="4" rx="2"/>
    <rect x="676" y="192" width="28" height="4" rx="2"/>
    <rect x="723" y="192" width="27" height="4" rx="2"/>
    <rect x="627" y="210" width="34" height="4" rx="2" opacity=".8"/>
    <rect x="676" y="210" width="23" height="4" rx="2" opacity=".8"/>
    <rect x="723" y="210" width="32" height="4" rx="2" opacity=".8"/>
  </g>
  <g fill="#e4edfc">
    <circle cx="632" cy="232" r="2.5"/>
    <circle cx="681" cy="232" r="2.5"/>
    <circle cx="728" cy="232" r="2.5"/>
    <circle cx="632" cy="251" r="2.5"/>
    <circle cx="681" cy="251" r="2.5"/>
    <circle cx="728" cy="251" r="2.5"/>
  </g>

  <!-- FLOW TO CLEANING -->
  <path class="flow" d="M772 216H812" stroke="#83b5ff" stroke-width="2" fill="none"/>
  <circle class="pulse" cx="792" cy="216" r="4" fill="#fff"/>

  <!-- CLEANING GEAR -->
  <g class="spin">
    <circle cx="850" cy="230" r="51" fill="none" stroke="#31588e" stroke-width="1.4" stroke-dasharray="3 7"/>
    <circle cx="850" cy="179" r="4" fill="#a8c7f5"/>
    <circle cx="901" cy="230" r="4" fill="#fff"/>
    <circle cx="850" cy="281" r="4" fill="#83b5ff"/>
    <circle cx="799" cy="230" r="4" fill="#83b5ff"/>
  </g>

  <g class="spinback">
    <ellipse cx="850" cy="230" rx="68" ry="38" fill="none" stroke="#4779c0" stroke-width="1.5" transform="rotate(-25 850 230)"/>
    <circle cx="850" cy="192" r="4" fill="#fff"/>
    <circle cx="918" cy="230" r="4" fill="#83b5ff"/>
  </g>

  <!-- FILTER / CLEAN ICON -->
  <g class="float" filter="url(#shadow)">
    <path d="M827 198H873L863 219V244L837 258V219Z" fill="url(#blue)" stroke="#c6dcff" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M837 219H863" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M841 236L847 242L859 229" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FLOW TO PREPARED DATA -->
  <path class="flow" d="M922 216H957" stroke="#83b5ff" stroke-width="2" fill="none"/>
  <circle class="pulse" cx="940" cy="216" r="4" fill="#fff"/>

  <!-- PREPARED FEATURES CARD -->
  <g filter="url(#shadow)">
    <rect x="957" y="158" width="166" height="120" rx="12" fill="#101c2e" stroke="#426da9" stroke-width="1.3"/>
    <rect x="957" y="158" width="166" height="27" rx="11" fill="#1b3558"/>
    <path d="M957 175V185H1123V175" fill="#1b3558"/>
  </g>
  <text class="font" x="971" y="176" font-size="10" font-weight="700" fill="#dceaff">PREPARED DATA</text>

  <g fill="#85b5ff">
    <rect x="973" y="199" width="10" height="10" rx="2"/>
    <rect x="973" y="219" width="10" height="10" rx="2"/>
    <rect x="973" y="239" width="10" height="10" rx="2"/>
  </g>
  <g stroke="#e1ebfc" stroke-width="2.3" stroke-linecap="round">
    <path d="M990 204H1105"/>
    <path d="M990 224H1090"/>
    <path d="M990 244H1100"/>
  </g>
  <g fill="#82b4ff">
    <rect x="1060" y="198" width="43" height="5" rx="2.5"/>
    <rect x="1044" y="218" width="45" height="5" rx="2.5"/>
    <rect x="1058" y="238" width="42" height="5" rx="2.5"/>
  </g>

  <!-- BOTTOM QUALITY CHECK PANEL -->
  <rect x="614" y="307" width="509" height="76" rx="13" fill="#101c2e" stroke="#355b91" stroke-width="1.2"/>
  <text class="font small" x="632" y="329" fill="#a9c7f5">PREPARATION CHECKLIST</text>

  <g transform="translate(634 349)">
    <circle r="8" fill="#244d83"/>
    <path d="M-4 0L-1 3L4 -3" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text class="font" x="649" y="353" font-size="11" fill="#e8f0ff">Missing Values</text>

  <g transform="translate(792 349)">
    <circle r="8" fill="#244d83"/>
    <path d="M-4 0L-1 3L4 -3" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text class="font" x="807" y="353" font-size="11" fill="#e8f0ff">Duplicates</text>

  <g transform="translate(919 349)">
    <circle r="8" fill="#244d83"/>
    <path d="M-4 0L-1 3L4 -3" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text class="font" x="934" y="353" font-size="11" fill="#e8f0ff">Feature Prep</text>

  <text class="font" x="614" y="421" font-size="10" letter-spacing="1.1" fill="#8398b8">DATA PROFILING · CLEANING · FEATURE ENGINEERING</text>
  <circle class="pulse" cx="1119" cy="420" r="3.5" fill="#8db6f4" filter="url(#glow)"/>

  <!-- SMALL FLOATING DATA PARTICLES -->
  <circle class="pulse" cx="795" cy="149" r="3" fill="#fff"/>
  <circle class="pulse" cx="934" cy="294" r="3" fill="#83b5ff"/>
  <circle class="shine" cx="1100" cy="292" r="2.5" fill="#fff"/>
  <circle class="shine" cx="782" cy="290" r="2.5" fill="#83b5ff"/>
</svg>
