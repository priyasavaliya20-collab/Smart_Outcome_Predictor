<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DCE5F0" stroke-width=".8"/>
    </pattern>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101F35"/>
      <stop offset="100%" stop-color="#050D19"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244774"/>
      <stop offset="100%" stop-color="#142B49"/>
    </linearGradient>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .mainTitle { font-size: 35px; font-weight: 800; fill: #17191F; }
      .eyebrow { font-size: 11px; font-weight: 700; fill: #28518A; letter-spacing: 2px; }
      .desc { font-size: 13px; fill: #59677D; }
      .panelTitle { font-size: 23px; font-weight: 800; fill: #FFFFFF; }
      .panelSub { font-size: 11px; fill: #B3C3D9; }
      .label { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .small { font-size: 9px; fill: #B7CAE0; }
      .wire { fill: none; stroke: #83B9FF; stroke-width: 1.7; }
      .moving { stroke-dasharray: 5 5; animation: flow 2s linear infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      .float2 { animation: float 3s ease-in-out 1s infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .progress { animation: progress 4s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes progress { 0% { width: 30px; } 50% { width: 260px; } 100% { width: 30px; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="29" fill="#FFFFFF"/>
  <rect width="1200" height="500" rx="29" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="498" rx="28" fill="none" stroke="#202124" stroke-width="2"/>

  <!-- LEFT SIDE -->
  <rect x="45" y="39" width="111" height="5" rx="2.5" fill="#23487F"/>
  <text x="47" y="76" class="eyebrow">ENSEMBLE LEARNING</text>

  <text x="45" y="122" class="mainTitle">Part E:</text>
  <text x="45" y="157" class="mainTitle">Voting &amp;</text>
  <text x="45" y="192" class="mainTitle">Stacking</text>
  <text x="45" y="227" class="mainTitle">Ensembles</text>

  <text x="46" y="260" class="desc">Multiple learners combine their strengths</text>
  <text x="46" y="278" class="desc">to produce one final prediction.</text>

  <!-- Concept card -->
  <rect x="45" y="296" width="490" height="92" rx="16" fill="#DCE5EF" opacity=".7"/>
  <rect x="45" y="291" width="490" height="92" rx="16" fill="#FFFFFF" stroke="#263B58" stroke-width="1.4"/>
  <rect x="45" y="291" width="6" height="92" rx="3" fill="#28548E"/>
  <text x="70" y="316" font-size="9" font-weight="700" fill="#718096" letter-spacing="1">TWO WAYS TO ENSEMBLE</text>
  <text x="70" y="343" font-size="21" font-weight="800" fill="#1B2638">Vote Together → Learn to Combine</text>
  <text x="70" y="365" font-size="12" fill="#5B6A80">Voting combines outputs; stacking learns from them.</text>

  <!-- Learning path -->
  <text x="46" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">BASE MODELS</text>
  <text x="177" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">VOTING</text>
  <text x="310" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">STACKING</text>
  <text x="445" y="414" font-size="9" font-weight="700" fill="#7A8799" letter-spacing="1">PREDICT</text>
  <path d="M55 429H477" stroke="#244A80" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="55" cy="429" r="8" fill="#FFFFFF" stroke="#28548E" stroke-width="2.4"/>
  <circle cx="119" cy="429" r="4" fill="#81B5FF" class="pulse"/>
  <circle cx="185" cy="429" r="8" fill="#28548E"/>
  <circle cx="252" cy="429" r="4" fill="#81B5FF" class="pulse"/>
  <circle cx="321" cy="429" r="8" fill="#28548E"/>
  <circle cx="399" cy="429" r="4" fill="#81B5FF" class="pulse"/>
  <circle cx="477" cy="429" r="8" fill="#FFFFFF" stroke="#28548E" stroke-width="2.4"/>
  <text x="46" y="464" font-size="10" fill="#75849A">Machine Learning • Model Combination</text>

  <!-- RIGHT DARK PANEL -->
  <rect x="582" y="37" width="576" height="426" rx="28" fill="#D4DFEB" opacity=".5"/>
  <rect x="582" y="37" width="576" height="426" rx="28" fill="url(#dark)" stroke="#28548E" stroke-width="1.6"/>

  <text x="614" y="76" font-size="10" font-weight="700" fill="#9EC5FF" letter-spacing="1.8">ENSEMBLE ENGINE / 05</text>
  <text x="614" y="106" class="panelTitle">Multiple Learners → One Decision</text>
  <text x="614" y="126" class="panelSub">Watch individual predictions become a final result.</text>

  <!-- Reference-inspired model flow container -->
  <rect x="614" y="148" width="530" height="180" rx="13" fill="#0B182A" stroke="#294B77" stroke-width="1.2"/>

  <!-- Model input cards -->
  <g class="float">
    <rect x="628" y="168" width="98" height="39" rx="7" fill="url(#node)" stroke="#3F6FA8"/>
    <rect x="628" y="168" width="4" height="39" rx="2" fill="#83B9FF"/>
    <text x="640" y="183" class="label">MODEL A</text>
    <text x="640" y="197" class="small">Class 1</text>
  </g>
  <g class="float2">
    <rect x="628" y="216" width="98" height="39" rx="7" fill="url(#node)" stroke="#3F6FA8"/>
    <rect x="628" y="216" width="4" height="39" rx="2" fill="#83B9FF"/>
    <text x="640" y="231" class="label">MODEL B</text>
    <text x="640" y="245" class="small">Class 1</text>
  </g>
  <g class="float">
    <rect x="628" y="264" width="98" height="39" rx="7" fill="url(#node)" stroke="#3F6FA8"/>
    <rect x="628" y="264" width="4" height="39" rx="2" fill="#83B9FF"/>
    <text x="640" y="279" class="label">MODEL C</text>
    <text x="640" y="293" class="small">Class 0</text>
  </g>

  <!-- Connectors into voting -->
  <path d="M726 187H760L790 217 M726 235H790 M726 283H760L790 253" class="wire moving"/>
  <path d="M783 211L791 217L783 223" fill="none" stroke="#83B9FF" stroke-width="1.5"/>

  <!-- Voting decision visual -->
  <g>
    <circle cx="830" cy="235" r="39" fill="none" stroke="#2B4B73" stroke-width="1.3" stroke-dasharray="4 5" class="pulse"/>
    <circle cx="830" cy="235" r="31" fill="#101F35" stroke="#83B9FF" stroke-width="1.6"/>
    <circle cx="830" cy="235" r="24" fill="#1A3557" stroke="#345D91"/>
    <path d="M817 235L826 244L844 224" fill="none" stroke="#A8D9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="830" y="282" text-anchor="middle" font-size="9" font-weight="700" fill="#C7DDF5">VOTING</text>
  </g>

  <!-- Vote to stacking -->
  <path d="M869 235H900" class="wire moving"/>
  <path d="M893 229L901 235L893 241" fill="none" stroke="#83B9FF" stroke-width="1.5"/>

  <!-- Stacking layers -->
  <g class="float">
    <rect x="903" y="180" width="92" height="22" rx="5" fill="#1E3B61" stroke="#638FC8"/>
    <path d="M913 187H938M943 187H978" stroke="#A6D3FF" stroke-width="1.2"/>
    <rect x="903" y="205" width="92" height="22" rx="5" fill="#274A78" stroke="#779ED3"/>
    <path d="M913 212H938M943 212H978" stroke="#C2E4FF" stroke-width="1.2"/>
    <rect x="903" y="230" width="92" height="22" rx="5" fill="#3A67A0" stroke="#8DC9FF"/>
    <path d="M913 237H938M943 237H978" stroke="#E1F4FF" stroke-width="1.2"/>
    <text x="949" y="270" text-anchor="middle" font-size="9" font-weight="700" fill="#C7DDF5">STACKING</text>
  </g>

  <!-- Meta learner output -->
  <path d="M995 216H1012" class="wire moving"/>
  <path d="M1005 210L1013 216L1005 222" fill="none" stroke="#83B9FF" stroke-width="1.5"/>

  <!-- Prediction chart + final card -->
  <g class="pulse">
    <path d="M1017 270V180" stroke="#31557F" stroke-width="1"/>
    <rect x="1027" y="232" width="9" height="38" rx="2" fill="#79AFFF"/>
    <rect x="1041" y="212" width="9" height="58" rx="2" fill="#5B91E6"/>
    <rect x="1055" y="193" width="9" height="77" rx="2" fill="#3C73C8"/>
  </g>
  <path d="M1068 235H1080" class="wire moving"/>
  <rect x="1081" y="183" width="49" height="87" rx="10" fill="#172D4C" stroke="#82BCFF" stroke-width="1.3"/>
  <circle cx="1105.5" cy="203" r="11" fill="#5B91E6"/>
  <path d="M1101 203L1104 206L1110 199" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="1105.5" y="233" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">FINAL</text>
  <text x="1105.5" y="244" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">PREDICTION</text>
  <rect x="1094" y="253" width="23" height="3" rx="1.5" fill="#83B9FF" class="pulse"/>

  <!-- Method strip -->
  <rect x="614" y="343" width="530" height="80" rx="11" fill="#0B182A" stroke="#294B77" stroke-width="1.2"/>
  <text x="630" y="363" font-size="9" font-weight="700" fill="#9EC5FF" letter-spacing="1">ENSEMBLE METHODS</text>

  <rect x="630" y="373" width="112" height="27" rx="6" fill="#1D385D" stroke="#426B9D"/>
  <text x="686" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#E6F3FF">Hard Voting</text>

  <rect x="751" y="373" width="112" height="27" rx="6" fill="#1D385D" stroke="#426B9D"/>
  <text x="807" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#E6F3FF">Soft Voting</text>

  <rect x="872" y="373" width="112" height="27" rx="6" fill="#1D385D" stroke="#426B9D"/>
  <text x="928" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#E6F3FF">Meta-Learner</text>

  <rect x="993" y="373" width="135" height="27" rx="6" fill="#1D385D" stroke="#426B9D"/>
  <text x="1060.5" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#E6F3FF">Out-of-Fold Data</text>

  <text x="614" y="449" font-size="9" fill="#7895B8">MODEL COMBINATION • VOTING • STACKING</text>
  <path d="M1015 449H1124" stroke="#426D9C" stroke-width="1.2" stroke-dasharray="4 6"/>
  <circle cx="1125" cy="449" r="3" fill="#8FC6FF" class="pulse"/>
</svg>
