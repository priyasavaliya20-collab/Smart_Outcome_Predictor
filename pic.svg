<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e0e5ed" stroke-width=".7"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111d30"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7eaff8"/>
      <stop offset="1" stop-color="#254a83"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <style>
      .font{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:12px;font-weight:bold;letter-spacing:2.2px}
      .tiny{font-size:9px;font-weight:bold;letter-spacing:1.3px}
      .orbit{
        transform-origin:850px 220px;
        animation:spin 9s linear infinite;
      }
      .orbit2{
        transform-origin:850px 220px;
        animation:spinBack 13s linear infinite;
      }
      .float{
        transform-box:fill-box;
        transform-origin:center;
        animation:float 3s ease-in-out infinite;
      }
      .pulse{
        transform-box:fill-box;
        transform-origin:center;
        animation:pulse 2s ease-in-out infinite;
      }
      .flow{
        stroke-dasharray:5 9;
        animation:flow 4s linear infinite;
      }
      .glowdot{animation:shine 1.8s ease-in-out infinite}
      @keyframes spin{
        from{transform:rotate(0deg)}
        to{transform:rotate(360deg)}
      }
      @keyframes spinBack{
        from{transform:rotate(360deg)}
        to{transform:rotate(0deg)}
      }
      @keyframes float{
        0%,100%{transform:translateY(0)}
        50%{transform:translateY(-7px)}
      }
      @keyframes pulse{
        0%,100%{transform:scale(.8);opacity:.6}
        50%{transform:scale(1.3);opacity:1}
      }
      @keyframes flow{
        to{stroke-dashoffset:-56}
      }
      @keyframes shine{
        0%,100%{opacity:.4}
        50%{opacity:1}
      }
    </style>
  </defs>

  <!-- MAIN BACKGROUND -->
  <rect x="1" y="1" width="1198" height="498" rx="29" fill="#fff" stroke="#202020" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="496" rx="28" fill="url(#grid)"/>

  <!-- LEFT TITLE -->
  <rect x="45" y="39" width="111" height="5" rx="2.5" fill="#1d3f73"/>
  <text class="font eyebrow" x="47" y="78" fill="#28518b">PREDICTIVE MACHINE LEARNING</text>
  <text class="font" x="45" y="124" font-size="35" font-weight="800" fill="#17191d">Smart Outcome</text>
  <text class="font" x="45" y="162" font-size="35" font-weight="800" fill="#17191d">Predictor</text>
  <text class="font" x="46" y="191" font-size="16" fill="#69717e">Python · Machine Learning · Prediction</text>
  <text class="font" x="46" y="224" font-size="14" fill="#4c5564">Learn from patterns to estimate likely outcomes.</text>
  <text class="font" x="46" y="245" font-size="14" fill="#4c5564">Turn input data into smarter predictions.</text>

  <!-- WORKFLOW CARD -->
  <g filter="url(#shadow)">
    <rect x="45" y="263" width="490" height="103" rx="19" fill="#fff" stroke="#202020" stroke-width="1.5"/>
    <rect x="46" y="280" width="6" height="68" rx="3" fill="#28518b"/>
  </g>
  <text class="font tiny" x="72" y="290" fill="#7a8290">PREDICTION WORKFLOW</text>
  <text class="font" x="72" y="320" font-size="21" font-weight="750" fill="#17191d">Input → Learn → Predict</text>
  <text class="font" x="72" y="344" font-size="13" fill="#606979">A trained model estimates the likely outcome.</text>

  <g transform="translate(483 314)">
    <circle r="20" fill="#f4f8ff" stroke="#28518b" stroke-width="1.8"/>
    <path d="M-9 -5H9Q12 -5 12 -2V5Q12 8 9 8H1L-5 12V8H-9Q-12 8 -12 5V-2Q-12 -5 -9 -5Z" fill="#214b83"/>
    <path d="M-6 0H6M-6 4H3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- LEFT PROGRESS LINE -->
  <g class="font" fill="#7c8492" font-size="9.5" font-weight="700" letter-spacing="2">
    <text x="46" y="397">INPUT</text>
    <text x="160" y="397">TRAIN</text>
    <text x="291" y="397">PREDICT</text>
    <text x="436" y="397">OUTCOME</text>
  </g>
  <path d="M55 429H460" stroke="#8ea6cb" stroke-width="2"/>
  <path class="flow" d="M55 429H460" stroke="#28518b" stroke-width="2" fill="none"/>
  <circle cx="55" cy="429" r="8" fill="#fff" stroke="#28518b" stroke-width="2.5"/>
  <circle cx="170" cy="429" r="8" fill="#28518b"/>
  <circle cx="305" cy="429" r="8" fill="#202020"/>
  <circle cx="460" cy="429" r="8" fill="#fff" stroke="#28518b" stroke-width="2.5"/>
  <circle class="pulse" cx="112" cy="429" r="4" fill="#85a9e2"/>
  <circle class="pulse" cx="238" cy="429" r="4" fill="#85a9e2"/>
  <circle class="pulse" cx="389" cy="429" r="4" fill="#85a9e2"/>

  <!-- RIGHT INTELLIGENCE PANEL -->
  <rect x="583" y="38" width="574" height="424" rx="28" fill="url(#bg)" stroke="#28518b" stroke-width="1.8"/>
  <text class="font eyebrow" x="620" y="78" fill="#a8c7f5">INTELLIGENCE ENGINE</text>
  <text class="font" x="620" y="108" font-size="25" font-weight="800" fill="#fff">Data → Model → Outcome</text>
  <text class="font" x="620" y="132" font-size="13" fill="#b7c0cf">Supervised learning · Predictive analysis</text>

  <!-- INPUT DATA CARD -->
  <rect x="620" y="162" width="108" height="104" rx="13" fill="#101c2e" stroke="#31578e" stroke-width="1.3"/>
  <text class="font tiny" x="634" y="181" fill="#9db8e5">INPUT DATA</text>
  <path d="M635 196H710M635 207H699M635 218H707M635 229H688M635 240H703" stroke="#dae5f8" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M635 196H680M635 218H671M635 240H678" stroke="#75a8ff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- CONNECTION TO MODEL -->
  <path class="flow" d="M728 215H788" fill="none" stroke="#7ba8f2" stroke-width="1.7"/>
  <circle class="pulse" cx="750" cy="215" r="3.5" fill="#fff"/>
  <circle class="pulse" cx="771" cy="215" r="3" fill="#80adff"/>

  <!-- TWO CIRCULAR ORBITS -->
  <g class="orbit">
    <ellipse cx="850" cy="220" rx="73" ry="68" fill="none" stroke="#4779c0" stroke-width="1.4" stroke-dasharray="2 8"/>
    <circle cx="850" cy="152" r="4" fill="#a9caff"/>
    <circle cx="923" cy="220" r="4.5" fill="#fff" filter="url(#glow)"/>
    <circle cx="850" cy="288" r="4" fill="#80adff"/>
    <circle cx="777" cy="220" r="4" fill="#fff" filter="url(#glow)"/>
  </g>

  <g class="orbit2">
    <ellipse cx="850" cy="220" rx="85" ry="46" transform="rotate(25 850 220)" fill="none" stroke="#31588e" stroke-width="1.5"/>
    <circle cx="850" cy="174" r="5" fill="#80adff" filter="url(#glow)"/>
    <circle cx="935" cy="220" r="4" fill="#9fc2ff"/>
    <circle cx="850" cy="266" r="4" fill="#fff"/>
    <circle cx="765" cy="220" r="4" fill="#80adff"/>
  </g>

  <!-- CENTER PREDICTION DOCUMENT -->
  <g class="float" filter="url(#shadow)">
    <path d="M814 171H862L887 196V267Q887 276 878 276H823Q814 276 814 267Z" fill="url(#paper)" stroke="#b7d2ff" stroke-width="1.5"/>
    <path d="M862 171V196H887" fill="#18345b" stroke="#b7d2ff" stroke-width="1.5"/>
    <path d="M829 211H870M829 224H870M829 237H860M829 250H864" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="870" cy="257" r="12" fill="#fff" stroke="#244e87" stroke-width="1.5"/>
    <path d="M864 257L868 261L876 252" fill="none" stroke="#214b83" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <ellipse cx="850" cy="309" rx="55" ry="7" fill="#234578" opacity=".5"/>

  <!-- PREDICTION BRANCHES -->
  <path d="M888 220H933L971 191M933 220L971 253" fill="none" stroke="#668ac2" stroke-width="1.6" stroke-linecap="round"/>
  <circle class="pulse" cx="925" cy="220" r="4" fill="#d9e7ff"/>
  <circle cx="939" cy="220" r="5" fill="#53657e"/>
  <circle class="pulse" cx="972" cy="191" r="6" fill="#80a9ed"/>
  <circle class="pulse" cx="972" cy="253" r="6" fill="#80a9ed"/>
  <circle class="glowdot" cx="1001" cy="191" r="6" fill="#8795aa"/>
  <circle class="glowdot" cx="1001" cy="253" r="6" fill="#8795aa"/>

  <!-- OUTCOME CARD -->
  <rect x="1018" y="181" width="110" height="82" rx="13" fill="#101c2e" stroke="#31578e" stroke-width="1.2"/>
  <circle cx="1073" cy="205" r="14" fill="#214a80"/>
  <path d="M1066 205L1071 210L1080 200" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="font" x="1073" y="230" text-anchor="middle" font-size="9" font-weight="700" fill="#a9c7f5">PREDICTED</text>
  <text class="font" x="1073" y="243" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">OUTCOME</text>

  <!-- STATUS CARD -->
  <rect x="620" y="329" width="270" height="48" rx="11" fill="#101c2e" stroke="#4777bf" stroke-width="1.4"/>
  <circle cx="643" cy="353" r="8" fill="#dceaff"/>
  <path d="M639 353L642 356L648 349" fill="none" stroke="#214b83" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="font" x="662" y="348" font-size="9" font-weight="700" letter-spacing="1.1" fill="#a9c7f5">MODEL STATUS</text>
  <text class="font" x="662" y="364" font-size="13" font-weight="800" fill="#fff">OUTCOME ESTIMATED</text>

  <!-- FOOTER -->
  <text class="font" x="620" y="426" font-size="9.5" letter-spacing="1.1" fill="#8393ad">PYTHON · FEATURE ENGINEERING · PREDICTION</text>
  <circle class="pulse" cx="1122" cy="426" r="2.8" fill="#8da9d6"/>
</svg>
